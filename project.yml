name: MarbleMobile
options:
  bundleIdPrefix: com.example.marble
  developmentLanguage: ko
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "RHWMV6VVZ6"
targets:
  MarbleMobileCore:
    type: framework
    platform: iOS
    sources:
      - Sources/MarbleMobileCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.marble.core
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
  MarbleMobile:
    type: application
    platform: iOS
    sources:
      - iOS/MarbleMobile
    dependencies:
      - target: MarbleMobileCore
    settings:
      base:
        INFOPLIST_FILE: iOS/MarbleMobile/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: com.jsj.marble.mobile
        PRODUCT_NAME: MarbleMobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          MARBLE_BASE_URL: "http://127.0.0.1:8000"
        Release:
          MARBLE_BASE_URL: "http://jsjmc.iptime.org:8000"
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "MarbleMobile app store"
