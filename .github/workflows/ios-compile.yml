name: iOS compile check

on:
  workflow_dispatch:
  push:
    paths:
      - 'iOS/**'
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'project.yml'
      - '.github/workflows/ios-compile.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run MarbleMobileCore tests
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for simulator without signing
        run: xcodebuild -project MarbleMobile.xcodeproj -scheme MarbleMobile -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Verify bundled game audio resources
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*/Build/Products/Debug-iphonesimulator/MarbleMobile.app' -print -quit)"
          test -n "$APP_PATH"
          AUDIO_COUNT="$(find "$APP_PATH" -type f \( -iname '*.wav' -o -iname '*.mp3' \) | wc -l | tr -d ' ')"
          test "$AUDIO_COUNT" = "76"
          for clip in game_start.wav my_turn.wav dice_roll.wav move_step_12.wav money_in.wav money_out.wav login.WAV ticktock_0.WAV airport_world.mp3 airplane.mp3; do
            test -n "$(find "$APP_PATH" -type f -name "$clip" -print -quit)"
          done
